{% load careweb_tags %}
<div class="care-cards">
  <div class="care-card care-card--urgent">
    <div class="care-card__head">{% icon "alert" %}<h3>Call 999 if</h3></div>
    <div class="care-card__body">
      <p>someone is in immediate danger, seriously ill or injured, or their life is at risk.</p>
    </div>
  </div>
  <div class="care-card">
    <div class="care-card__head">{% icon "info" %}<h3>Use NHS 111 if</h3></div>
    <div class="care-card__body">
      <p>you need urgent medical help or advice and it is not life-threatening. Go to <a href="https://111.nhs.uk/" rel="noopener">111.nhs.uk</a> or call 111.</p>
    </div>
  </div>
</div>
