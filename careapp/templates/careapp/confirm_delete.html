{% extends "careapp/base.html" %}
{% load careweb_tags %}
{% block content %}
<div class="card narrow">
  <h2 class="card__title">Delete “{{ object }}”?</h2>
  <p class="muted">This permanently removes it{% if section_key == 'service-users' %}, including its shifts{% endif %}. This cannot be undone.</p>
  <form method="post" class="form-actions">
    {% csrf_token %}
    <button class="btn btn--danger" type="submit">Yes, delete</button>
    <a class="btn btn--ghost" href="{% url 'careapp:section_edit' section_key object.pk %}">Cancel</a>
  </form>
</div>
{% endblock %}
